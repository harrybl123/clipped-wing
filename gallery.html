<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <title>Clipped Wing — sprite gallery (dev)</title>
    <style>
      body { --bg: #1c1611; margin: 0; padding: 16px 24px; background: var(--bg); color: #b3a898; font: 13px/1.4 Menlo, monospace; }
      h1 { font-size: 16px; color: #f4f1e8; } h2 { font-size: 14px; color: #f2b45a; margin-top: 28px; }
      button { font: inherit; background: #2a221b; color: #f4f1e8; border: 1px solid #7a6a58; padding: 4px 10px; cursor: pointer; }
      .grid { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
      figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
      canvas { image-rendering: pixelated; }
      figcaption { font-size: 11px; opacity: 0.8; }
    </style>
  </head>
  <body>
    <h1>Sprite gallery (dev only) <button id="toggle-bg">toggle dark / lit background</button></h1>
    <div id="gallery"></div>
    <script type="module" src="/src/dev/gallery.ts"></script>
  </body>
</html>
